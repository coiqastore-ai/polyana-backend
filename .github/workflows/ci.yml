name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Catches the syntax / import-time crashes that have taken the bot down before.
      - name: compile
        run: python -m py_compile main.py invite.py
      - name: requirements resolve
        run: pip install --dry-run -r requirements.txt
